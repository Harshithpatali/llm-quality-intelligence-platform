name: Keep Render API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          set -euo pipefail

          URL="https://llm-quality-intelligence-platform.onrender.com/health"
          echo "Pinging $URL"

          curl --fail --silent --show-error             --max-time 30             --retry 2             --retry-delay 5             "$URL"

          echo
          echo "Render health check completed."
