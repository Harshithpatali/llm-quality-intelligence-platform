services:
  - type: web
    name: llm-quality-intelligence-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_MODELS
        value: openai/gpt-oss-120b,deepseek/deepseek-v4-flash-0731
      - key: JUDGE_PROVIDER
        value: groq
      - key: JUDGE_MODEL
        value: openai/gpt-oss-120b
